name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: github.event.action == 'labeled' && github.event.label.name == 'ai-review'
    uses: co-cddo/gds-idea-workflows-catalogue/.github/workflows/ci_ai_review.yml@main
    secrets: inherit

  lint:
    if: github.event.action != 'labeled' || github.event.label.name != 'ai-review'
    uses: co-cddo/gds-idea-workflows-catalogue/.github/workflows/ci_pkg_lint.yml@main

  test:
    if: github.event.action != 'labeled' || github.event.label.name != 'ai-review'
    uses: co-cddo/gds-idea-workflows-catalogue/.github/workflows/ci_pkg_test.yml@main

  build:
    if: github.event.action != 'labeled' || github.event.label.name != 'ai-review'
    uses: co-cddo/gds-idea-workflows-catalogue/.github/workflows/ci_pkg_build.yml@main